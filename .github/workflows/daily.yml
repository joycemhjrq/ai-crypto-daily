name: AI Crypto Daily Report

on:
  push:
  schedule:
    - cron: '0 1 * * *'   # 北京时间 9:00（UTC 1:00）
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests openai

      - name: Run Daily Report
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          ALPHA_KEY: ${{ secrets.ALPHA_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
        run: python daily_report.py
